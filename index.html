<style>
  .app-container {
    display: grid;
    height: 100vh;
    width: 100vw;
    grid-template-rows: 64px 1fr;
    /* Desktop layout (default) */
    grid-template-columns: 240px 1fr 320px;
    grid-template-areas: 
      "header header header"
      "sidebar main context";
  }

  /* Tablet layout */
  @media (max-width: 1024px) {
    .app-container {
      grid-template-columns: 240px 1fr;
      grid-template-areas: 
        "header header"
        "sidebar main";
    }
    .context-panel {
        display: none;
    }
  }

  /* Mobile layout */
  @media (max-width: 768px) {
    .app-container {
      grid-template-columns: 1fr;
      grid-template-areas: 
        "header"
        "main";
    }
    .sidebar {
        position: fixed;
        left: -240px;
        top: 64px;
        height: calc(100vh - 64px);
        z-index: 50;
        transition: left 250ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .sidebar.open {
        left: 0;
    }
  }

  /* Sidebar backdrop for mobile */
  .sidebar-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(0,0,0,0.5);
      z-index: 40; /* Just below sidebar */
      opacity: 0;
      pointer-events: none;
      transition: opacity 250ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  .sidebar-backdrop.open {
      opacity: 1;
      pointer-events: auto;
  }

  /* Logo Animations */
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: 0.8; }
    50% { transform: scale(1.05); opacity: 1; }
  }
  @keyframes shimmer {
    0% { background-position: -200% center; }
    100% { background-position: 200% center; }
  }
  .animate-shimmer {
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.2), transparent);
    background-size: 200% 200%;
    animation: shimmer 5s linear infinite;
  }
  
  @keyframes glow {
    0%, 100% {
      filter: drop-shadow(0 0 5px rgba(153, 102, 204, 0.5)) drop-shadow(0 0 15px rgba(153, 102, 204, 0.3));
    }
    50% {
      filter: drop-shadow(0 0 15px rgba(153, 102, 204, 0.8)) drop-shadow(0 0 30px rgba(153, 102, 204, 0.5));
    }
  }

  /* Ambient Background Animation */
  body {
    position: relative;
    z-index: 1;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    background: 
      radial-gradient(ellipse at 20% 80%, rgba(50, 184, 198, 0.1), transparent 50%),
      radial-gradient(ellipse at 90% 10%, rgba(153, 102, 204, 0.1), transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(230, 129, 97, 0.05), transparent 60%);
    opacity: 0.6;
    animation: nebula-swirl 90s linear infinite;
  }

  @keyframes nebula-swirl {
    0% {
      transform: rotate(0deg) scale(1.5);
      background-position: 0% 50%, 100% 50%, 50% 0%;
    }
    50% {
      transform: rotate(180deg) scale(1.5);
      background-position: 100% 50%, 0% 50%, 50% 100%;
    }
    100% {
      transform: rotate(360deg) scale(1.5);
      background-position: 0% 50%, 100% 50%, 50% 0%;
    }
  }

  /* Constellation Loader Animation */
  .constellation-loader {
    position: relative;
    width: 100px;
    height: 100px;
  }
  
  .constellation-loader .node {
    position: absolute;
    width: 8px;
    height: 8px;
    background-color: #32B8C6;
    border-radius: 50%;
    box-shadow: 0 0 10px #32B8C6, 0 0 20px #32B8C6;
    animation: pulse 2s infinite ease-in-out;
  }

  .constellation-loader .node:nth-child(1) { top: 10%; left: 50%; transform: translateX(-50%); animation-delay: 0s; }
  .constellation-loader .node:nth-child(2) { top: 30%; left: 20%; animation-delay: -0.4s; }
  .constellation-loader .node:nth-child(3) { top: 30%; left: 80%; animation-delay: -0.8s; }
  .constellation-loader .node:nth-child(4) { top: 70%; left: 30%; animation-delay: -1.2s; }
  .constellation-loader .node:nth-child(5) { top: 70%; left: 70%; animation-delay: -1.6s; }
  .constellation-loader .node:nth-child(6) { top: 90%; left: 50%; transform: translateX(-50%); animation-delay: -2.0s; }
  
  .constellation-loader svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform: rotate(15deg);
  }
  
  .constellation-loader .line {
    stroke: rgba(50, 184, 198, 0.3);
    stroke-width: 1;
    animation: dash 4s linear infinite;
  }
  
  @keyframes pulse {
    0%, 100% { transform: scale(0.8); opacity: 0.5; }
    50% { transform: scale(1.2); opacity: 1; }
  }
  
  @keyframes dash {
    from { stroke-dashoffset: 100; opacity: 0; }
    to { stroke-dashoffset: 0; opacity: 1; }
  }

  .initial-loader {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    width: 100vw;
    background-color: #1F2121;
    color: #a7a9a9;
    font-size: 1.2rem;
  }
</style>
</head>
